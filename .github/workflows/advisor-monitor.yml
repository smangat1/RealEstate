name: Advisor monitor

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: advisor-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check active saved listings
        env:
          ADVISOR_MONITOR_TOKEN: ${{ secrets.ADVISOR_MONITOR_TOKEN }}
        run: |
          if [ -z "$ADVISOR_MONITOR_TOKEN" ]; then
            echo "ADVISOR_MONITOR_TOKEN is not configured."
            exit 1
          fi
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --max-time 540 \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $ADVISOR_MONITOR_TOKEN" \
            https://real-estate-samyanmangat-6662s-projects.vercel.app/api/cron/advisor-monitor)"
          if [ "$status" != "200" ]; then
            echo "Advisor monitor returned HTTP $status."
            exit 1
          fi
          echo "Advisor monitoring completed successfully."
